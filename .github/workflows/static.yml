name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "slides/domain-slides.html"
      - "datatale/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare site folder
        run: |
          cp slides/domain-slides.html datatale/index.html
          touch datatale/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: datatale

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
